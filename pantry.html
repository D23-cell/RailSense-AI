<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RailSense AI | Pantry Hub</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .pantry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .pantry-card {
        background: var(--card);
        padding: 30px;
        border-radius: 15px;
        border-bottom: 5px solid var(--accent);
        transition: transform 0.3s;
      }
      .pantry-card:hover {
        transform: translateY(-5px);
      }
      .big-val {
        font-size: 64px;
        font-weight: 800;
        color: var(--accent);
        margin: 10px 0;
      }
      .label {
        font-size: 14px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .status-banner {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-weight: bold;
        font-size: 20px;
        transition: 0.5s;
      }
      .normal {
        background: rgba(34, 197, 94, 0.2);
        color: var(--accent);
      }
      .urgent {
        background: rgba(239, 68, 68, 0.2);
        color: var(--danger);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <button
      onclick="window.location.href = '/'"
      style="
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: #1e293b;
        color: white;
        border-radius: 8px;
        border: 1px solid #334155;
        cursor: pointer;
      "
    >
      ⬅ Back to Dashboard
    </button>
    <h1 style="color: var(--accent)">🍱 RailSense Pantry Optimizer</h1>
    <p style="color: #94a3b8">Real-time Food Demand based on Coach Occupancy</p>

    <div id="statusBanner" class="status-banner normal">
      SYSTEM ACTIVE: MONITORING DEMAND
    </div>

    <div class="pantry-grid">
      <div class="pantry-card">
        <div class="label">Current Occupancy</div>
        <div id="occVal" class="big-val">0</div>
        <div class="label">Passengers in Coach</div>
      </div>

      <div class="pantry-card" style="border-color: var(--warning)">
        <div class="label">Meals Needed</div>
        <div id="mealVal" class="big-val">0</div>
        <div class="label">Standard Veg/Non-Veg</div>
      </div>

      <div class="pantry-card" style="border-color: #3b82f6">
        <div class="label">Water Inventory</div>
        <div id="waterVal" class="big-val">0</div>
        <div class="label">Bottles (500ml)</div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://railsense-ai.onrender.com";

      function refreshPantry() {
        fetch(`${API_BASE_URL}/pantry_demand`)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("occVal").innerText =
              data.current_occupancy;
            document.getElementById("mealVal").innerText = data.meals_needed;
            document.getElementById("waterVal").innerText = data.water_bottles;

            const banner = document.getElementById("statusBanner");
            if (data.pantry_status === "URGENT PREP") {
              banner.innerText =
                "🚨 ALERT: HIGH DEMAND - START PREPARING EXTRA MEALS";
              banner.className = "status-banner urgent";
            } else {
              banner.innerText = "✅ NORMAL DEMAND: OPTIMIZING WASTE";
              banner.className = "status-banner normal";
            }
          })
          .catch((err) => {
            console.log("Server Offline...");
            document.getElementById("statusBanner").innerText =
              "⚠️ SERVER OFFLINE - CHECK BACKEND";
            document.getElementById("statusBanner").className =
              "status-banner urgent";
          });
      }
      setInterval(refreshPantry, 3000);
      refreshPantry();
    </script>
  </body>
</html>
